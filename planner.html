<main>

<div class="wrap page-title"><h1>Academic planner</h1><p>Add tasks, tick them off when done, and delete what you no longer need. Your tasks stay saved in this browser.</p></div>
<section>
<div class="wrap">
<div class="panel">
<form id="taskForm" class="add-task" novalidate>
<label class="sr" for="taskInput" style="position:absolute;left:-9999px">Task</label>
<input type="text" id="taskInput" placeholder="For example: Read chapter 3 of Intro to Cybersecurity" maxlength="120">
<label for="taskDate" style="position:absolute;left:-9999px">Due date</label>
<input type="date" id="taskDate">
<button class="btn" type="submit">Add task</button>
</form>
<p class="error" id="taskMsg" role="alert"></p>
<ul id="taskList"></ul>
<div class="stats"><span id="count">0 of 0 completed</span><button class="btn ghost" id="clearDone" type="button" style="padding:.4rem 1rem;font-size:.9rem">Clear completed</button></div>
</div>
</div>
</section>
</main>
