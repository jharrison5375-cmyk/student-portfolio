<main>

<div class="wrap page-title"><h1>Contact me</h1><p>Send a message using the form, or email me directly.</p></div>
<section>
<div class="wrap contact">
<form class="panel" id="contactForm" novalidate>
<div class="field"><label for="name">Name</label><input type="text" id="name" name="name" autocomplete="name"><p class="error" id="nameError"></p></div>
<div class="field"><label for="email">Email address</label><input type="text" id="email" name="email" autocomplete="email"><p class="error" id="emailError"></p></div>
<div class="field"><label for="phone">Phone number</label><input type="text" id="phone" name="phone" inputmode="numeric" autocomplete="tel"><p class="error" id="phoneError"></p></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><p class="error" id="messageError"></p></div>
<button class="btn" type="submit">Send message</button>
<p id="formStatus" role="status"></p>
</form>
<aside class="panel">
<h2>Details</h2>
<ul class="clean"><li><a href="mailto:jenniferharrisonstudio@gmail.com">jenniferharrisonstudio@gmail.com</a></li><li>MIVA Open University, Cybersecurity</li></ul>
</aside>
</div>
</section>
